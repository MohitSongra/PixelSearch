name: pixelsearch
description: "PixelSearch - private, Android-first semantic photo retrieval."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  photo_manager: ^3.6.4
  permission_handler: ^11.3.1
  # M2 — local persistence (native-only via a conditional connection; see docs/ADR-007)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.4
  # M4 — on-device CLIP inference + image preprocessing
  onnxruntime: ^1.4.1
  image: ^4.3.0
  google_mlkit_image_labeling: ^0.15.0
  google_mlkit_face_detection: ^0.14.0
  workmanager: ^0.10.7
  exif: ^3.3.0
  crypto: ^3.0.6
  http: ^1.3.0
  flutter_map: ^8.2.2
  flutter_map_marker_cluster: ^8.2.2
  latlong2: ^0.9.1
  flutter_secure_storage: ^9.2.4
  record: ^6.1.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  sqlite3: ^3.5.1
  path_provider_platform_interface: ^2.1.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
  # Listed file by file: a dropped-in file (for example a MobileCLIP export)
  # must never ship by accident. assets/branding/ is read from disk by
  # flutter_launcher_icons only, so it is not bundled.
  assets:
    - assets/samples/
    - assets/models/bpe_simple_vocab_16e6.txt.gz
    - assets/models/face_recognition_sface_2021dec.onnx
    - assets/models/SFACE_LICENSE.txt
    - assets/models/sface_reference.json
    - assets/models/sface_reference_source.png
    - assets/evaluation/
    - assets/fonts/OFL.txt
    - assets/licenses/CLIP_TOKENIZER_LICENSE.txt
