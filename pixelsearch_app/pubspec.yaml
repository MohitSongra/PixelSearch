name: pixelsearch
description: "PixelSearch — Privacy-first, AI-powered semantic photo retrieval (mobile demo)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  photo_manager: ^3.6.4
  permission_handler: ^11.3.1
  # M2 — local persistence (native-only via a conditional connection; see docs/ADR-007)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.4
  # M4 — on-device CLIP inference + image preprocessing
  onnxruntime: ^1.4.1
  image: ^4.3.0
  google_mlkit_image_labeling: ^0.15.0
  google_mlkit_face_detection: ^0.14.0
  workmanager: ^0.10.7
  exif: ^3.3.0
  crypto: ^3.0.6

dev_dependencies:
  path_provider_platform_interface: ^2.1.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
    - assets/models/
    - assets/evaluation/
