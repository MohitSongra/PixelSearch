name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  repository:
    name: Repository layout and publication boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tool/check_repository.py

  backend:
    name: Enhancement backend contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enhancement_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -c requirements.lock
      - run: python -m pytest -q

  flutter:
    name: Flutter analyze + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pixelsearch_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test test/
      # NOTE: integration_test/ (image/text parity, golden, benchmark) needs a real
      # ONNX Runtime host (desktop/emulator) and the model artifacts. Run those on a
      # self-hosted runner or device:  xvfb-run flutter test integration_test -d linux

  modelkit:
    name: ModelKit metric tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model_kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python eval/test_metrics.py
